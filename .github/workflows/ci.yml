name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

  smoke:
    name: harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      # Node 22, unlike the job above: the harness needs it even though it
      # declares no `engines`. On 20 the boot dies in the loader, because
      # dsh-session-persistence-jsonl imports `createZstdDecompress` from
      # `node:zlib` and dsh-agent-loop calls `Promise.withResolvers`, neither of
      # which exists there. This plugin itself is fine on 20, which is what the
      # build job covers.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      # The harness goes in a directory of its own, deliberately. Installed
      # into this package it would be resolved against the plugin's own
      # lockfile and peer set, which takes npm many minutes; standalone it is a
      # plain install of ~200 packages. The profile's bundles resolve from the
      # dsh installation first, so dsh-base and dsh-headless are found beside
      # the binary DSH_BIN names.
      - name: install the harness
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          npm init -y >/dev/null
          npm i --no-audit --no-fund \
            @deepseek-ai/dsh@next \
            @deepseek-ai/dsh-base@next \
            @deepseek-ai/dsh-headless@next
      # Boots a real cordis kernel with this plugin mounted, against a stub
      # gateway. The unit suite never loads the plugin the way cordis does, so
      # this is the only job that can catch a plugin that fails to activate.
      - run: npm run smoke
        env:
          DSH_BIN: ${{ runner.temp }}/harness/node_modules/.bin/dsh
