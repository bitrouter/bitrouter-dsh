name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The harness smoke job tracks a moving upstream, so it runs on a clock as
    # well as on merges — that is where drift in `next` should surface, rather
    # than on somebody's unrelated pull request.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

  smoke:
    name: harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not on every pull request. Installing the harness is ~200 packages and
    # around fifteen minutes against seventeen seconds for everything else, and
    # what it uniquely proves — that llm-pi-ai still accepts the profile this
    # plugin writes, and that the model id survives to the wire — changes when
    # the *upstream* moves, not when this package does. So it runs on merges to
    # main, nightly, on demand, and on a pull request that asks for it by
    # carrying the `harness-smoke` label.
    #
    # `harness-update` earns the same treatment: Dependabot stamps it on every
    # bump of a `@deepseek-ai/*` peer (see .github/dependabot.yml), and a
    # harness bump is precisely the change this job exists to catch. Gating on
    # `harness-smoke` alone would skip it on the one pull request that needs it.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'harness-smoke') ||
      contains(github.event.pull_request.labels.*.name, 'harness-update')
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      # Node 22, unlike the job above: the harness needs it even though it
      # declares no `engines`. On 20 the boot dies in the loader, because
      # dsh-session-persistence-jsonl imports `createZstdDecompress` from
      # `node:zlib` and dsh-agent-loop calls `Promise.withResolvers`, neither of
      # which exists there. This plugin itself is fine on 20, which is what the
      # build job covers.
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build

      # Exact versions rather than `@next`, so the install is reproducible and
      # the cache key means something. The nightly run is what notices when the
      # upstream moves past them; a pull request should not discover it.
      #
      # Read out of package.json rather than written here, so the harness
      # version lives in exactly one place. Spelled literally, this string was
      # a third copy — invisible to Dependabot, and free to drift away from the
      # devDependency the unit suite compiles against until a smoke failure
      # nobody could explain. The pin must stay exact: a range would install
      # something other than what `npm ci` resolved, which is the drift this
      # step is meant to remove.
      - name: resolve the harness version
        id: harness
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').devDependencies['@deepseek-ai/dsh-llm-pi-ai']")
          case "$V" in
            [0-9]*) ;;
            *) echo "::error::the @deepseek-ai/dsh-llm-pi-ai devDependency must be an exact version for the smoke install to be reproducible; got '$V'"; exit 1 ;;
          esac
          echo "resolved harness version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: harness-cache
        with:
          path: ${{ runner.temp }}/harness
          key: dsh-harness-${{ runner.os }}-node22-${{ steps.harness.outputs.version }}

      # The harness goes in a directory of its own, deliberately. Installed into
      # this package it would be resolved against the plugin's own lockfile and
      # peer set, which takes npm many minutes; standalone it is a plain
      # install. The profile's bundles resolve from the dsh installation first,
      # so dsh-base and dsh-headless are found beside the binary DSH_BIN names.
      - name: install the harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.harness.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          npm init -y >/dev/null
          npm i --no-audit --no-fund \
            "@deepseek-ai/dsh@$V" \
            "@deepseek-ai/dsh-base@$V" \
            "@deepseek-ai/dsh-headless@$V"

      # Boots a real cordis kernel with this plugin mounted, against a stub
      # gateway. `test/activation.test.ts` covers the cordis contract on every
      # pull request in milliseconds; this covers the harness contracts that
      # only a real boot can reach.
      - run: npm run smoke
        env:
          DSH_BIN: ${{ runner.temp }}/harness/node_modules/.bin/dsh
