# BitRouter on DeepSeek Harness — no plugin.
#
# The same route this plugin would write, entered by hand in
# `$DSH_HOME/settings.yaml`. You lose live model discovery and maintain the
# `models:` list yourself; everything else is identical, including the
# wire-compat switches. `dsh-base` already mounts the llm-pi-ai adapter, so
# this section alone is enough to make the route live.
#
# Swap baseURL to http://127.0.0.1:4356/v1 for a local BitRouter daemon.
#
# Setting BitRouter as the *default* is the second half, and lives in the
# profile's own `cordis.patch.yml` rather than here — the plugin's bundle patch
# does exactly this when it is installed:
#
#     - id: agent-default-model
#       config:
#         provider: bitrouter
#         model: bitrouter/auto

llm-pi-ai:
  providers:
    bitrouter:
      displayName: BitRouter
      apiKeyEnv: BITROUTER_API_KEY
      api: openai-completions
      baseURL: https://api.bitrouter.ai/v1
      # BitRouter is not an OpenAI backend: pi-ai would otherwise address an
      # unrecognized URL as though it were, and the gateway rejects the
      # OpenAI-only request fields with "Extra inputs are not permitted".
      compat:
        supportsStore: false
        supportsUsageInStreaming: false
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        # The auto route: BitRouter picks the model per request. Listed first
        # so a model selector offers it first. The capacities are the
        # conservative floor — `auto` may land on any model in the ladder, and
        # over-claiming fails a request mid-turn where under-claiming only
        # compacts early.
        - id: bitrouter/auto
          name: BitRouter Auto
          contextWindow: 128000
          maxTokens: 16384
          input: [text, image]
        # `auto` is the default, not the only option. Add whichever specific
        # models you want to be able to pin; ids are what `GET /v1/models`
        # lists.
        - id: anthropic/claude-opus-4.6
          name: 'Anthropic: Claude Opus 4.6'
          contextWindow: 200000
          maxTokens: 16384
          input: [text, image]
